<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Luxe Horizon</title>
    <meta name="description" content="Luxe Horizon — a private mobile-first catalogue of latest luxury arrivals." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://luxehorizon.store/" />
    <meta property="og:site_name" content="Luxe Horizon" />
    <meta property="og:title" content="Luxe Horizon" />
    <meta property="og:description" content="The pinnacle of luxury shopping." />
    <meta property="og:image" content="https://luxehorizon.store/assets/hero.png" />
    <meta property="og:url" content="https://luxehorizon.store/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Luxe Horizon" />
    <meta name="twitter:description" content="The pinnacle of luxury shopping." />
    <meta name="twitter:image" content="https://luxehorizon.store/assets/hero.png" />
    <meta name="theme-color" content="#512228" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Luxe Horizon" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="Luxe Horizon" />
    <meta name="msapplication-TileColor" content="#512228" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.svg?v=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=official-9" />
    <link rel="shortcut icon" href="/favicon.svg?v=official-9" />
    <link rel="mask-icon" href="/favicon.svg?v=official-9" color="#512228" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      (() => {
        try {
          if (location.pathname.startsWith('/admin')) return;
          const visitorKey = 'lh_visitor_id';
          const sessionKey = 'lh_session_id';
          let visitorId = localStorage.getItem(visitorKey);
          if (!visitorId) {
            visitorId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
            localStorage.setItem(visitorKey, visitorId);
          }
          let sessionId = sessionStorage.getItem(sessionKey);
          if (!sessionId) {
            sessionId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
            sessionStorage.setItem(sessionKey, sessionId);
          }
          const query = new URLSearchParams(location.search);
          const ref = query.get('ref') || null;
          const send = (eventType, extra = {}) => {
            const payload = JSON.stringify({ visitorId, sessionId, eventType, path: location.pathname, ref, ...extra });
            if (navigator.sendBeacon) navigator.sendBeacon('/api/track', new Blob([payload], { type: 'application/json' }));
            else fetch('/api/track', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: payload, keepalive: true });
          };

          const lastVisitKey = 'lh_last_site_visit';
          const now = Date.now();
          const last = Number(localStorage.getItem(lastVisitKey) || 0);
          if (now - last >= 30 * 60 * 1000) {
            localStorage.setItem(lastVisitKey, String(now));
            send('site_visit');
          }

          const productMatch = location.pathname.match(/^\/(?:product|catalogue\/product)\/([^/]+)/);
          if (productMatch) send('product_view', { productId: decodeURIComponent(productMatch[1]) });

          const startedAt = Date.now();
          let engaged = false;
          let sentEnd = false;
          const scrollMilestones = new Set();
          const getScrollDepth = () => {
            const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
            return Math.min(100, Math.round((window.scrollY / max) * 100));
          };
          const markEngaged = () => {
            if (engaged) return;
            if (Date.now() - startedAt >= 20000) {
              engaged = true;
              send('engaged_visit', { durationSeconds: Math.round((Date.now() - startedAt) / 1000), scrollDepth: getScrollDepth() });
            }
          };
          const onScroll = () => {
            const depth = getScrollDepth();
            for (const milestone of [25, 50, 75, 90]) {
              if (depth >= milestone && !scrollMilestones.has(milestone)) {
                scrollMilestones.add(milestone);
                send('scroll_depth', { scrollDepth: milestone });
              }
            }
            markEngaged();
          };
          const onActivity = () => markEngaged();
          const endSession = () => {
            if (sentEnd) return;
            sentEnd = true;
            const durationSeconds = Math.round((Date.now() - startedAt) / 1000);
            if (durationSeconds >= 5) send('session_end', { durationSeconds, scrollDepth: getScrollDepth() });
          };
          window.addEventListener('scroll', onScroll, { passive: true });
          ['pointerdown', 'touchstart', 'keydown'].forEach((eventName) => window.addEventListener(eventName, onActivity, { passive: true }));
          document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') endSession(); });
          window.addEventListener('pagehide', endSession);

          document.addEventListener('click', (event) => {
            const target = event.target instanceof Element ? event.target : null;
            if (!target) return;
            if (target.closest('[data-testid="link-whatsapp-enquiry"]')) send('whatsapp_click');
            const link = target.closest('a[href]');
            if (!link) return;
            const href = link.getAttribute('href') || '';
            const match = href.match(/^\/(?:product|catalogue\/product)\/([^/?#]+)/);
            if (match) send('product_click', { productId: decodeURIComponent(match[1]) });
          });
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
